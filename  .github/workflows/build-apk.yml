name: Build Super Sausage APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p build-source
          unzip -q "Super_Sausage_Auto_Screen_Recognition_v3.zip" -d build-source

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find build-source -type f \( -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "No Android project found in ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Find APK
        run: |
          mkdir -p apk-output
          find build-source -name "*.apk" -exec cp {} apk-output/ \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Sausage-APK
          path: apk-output/*.apk